name: CD

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  ACR_LOGIN_SERVER: acrcommerceplatformdev.azurecr.io
  ACR_NAME: acrcommerceplatformdev
  IMAGE_REPOSITORY: commerce-order-service
  RESOURCE_GROUP: rg-commerce-dev
  CONTAINER_APP_NAME: commerce-order-service-dev

jobs:
  deploy:
    name: Build, push, and deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        run: az acr login --name $ACR_NAME

      - name: Build Docker image
        run: docker build -t $ACR_LOGIN_SERVER/$IMAGE_REPOSITORY:${{ github.sha }} .

      - name: Push Docker image
        run: docker push $ACR_LOGIN_SERVER/$IMAGE_REPOSITORY:${{ github.sha }}

      - name: Deploy to Azure Container Apps
        run: |
          az containerapp update \
            --name $CONTAINER_APP_NAME \
            --resource-group $RESOURCE_GROUP \
            --image $ACR_LOGIN_SERVER/$IMAGE_REPOSITORY:${{ github.sha }}
