spring:
  application:
    name: commerce-order-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/order_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

product:
  service:
    url: ${PRODUCT_SERVICE_URL:http://localhost:8081}

resilience4j:
  circuitbreaker:
    circuit-breaker-aspect-order: 1
    instances:
      productService:
        sliding-window-type: count_based
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 2
        record-exceptions:
          - com.faezeh.commerce.order.exception.ProductServiceException
          - java.util.concurrent.TimeoutException
        ignore-exceptions:
          - com.faezeh.commerce.order.exception.ProductNotFoundException
          - com.faezeh.commerce.order.exception.ProductUnavailableException
  retry:
    retry-aspect-order: 2
    instances:
      productService:
        max-attempts: 3
        wait-duration: 200ms
        retry-exceptions:
          - com.faezeh.commerce.order.exception.ProductServiceCommunicationException
          - java.util.concurrent.TimeoutException
        ignore-exceptions:
          - com.faezeh.commerce.order.exception.ProductNotFoundException
          - com.faezeh.commerce.order.exception.ProductUnavailableException
  timelimiter:
    time-limiter-aspect-order: 3
    instances:
      productService:
        timeout-duration: 2s
        cancel-running-future: true

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
